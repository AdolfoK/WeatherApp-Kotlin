
name: Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Dar permisos de ejecucion a Gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 5. Compilar y ejecutar pruebas unitarias
      - name: Build and run unit tests
        run: |
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      # 6. Verificar que se genero el APK
      - name: Verify Debug APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # 7. Subir el APK como artefacto
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherApp-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
